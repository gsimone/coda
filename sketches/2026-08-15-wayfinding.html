<!doctype html>
<!-- A chart of a day spent wayfinding: the walked path glows through fog, closed decisions burn warm along it, the frontier rings the edge of the light, and the destination glimmers unreached below. -->
<html>
<head>
<meta charset="utf-8" />
<title>wayfinding</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.11.3/p5.min.js"></script>
<style>
  html, body { margin: 0; height: 100%; background: rgb(232, 230, 226); }
  body { display: grid; place-items: center; }
  main { line-height: 0; }
  canvas { box-shadow: 0 12px 48px rgba(20, 20, 35, 0.35); }
</style>
</head>
<body>
<script>
// oklch(L 0–1, C, H deg) → [r, g, b] each 0–255, clamped to sRGB gamut
function oklch(L, C, H) {
  const h = (H * Math.PI) / 180;
  const a = C * Math.cos(h), b = C * Math.sin(h);
  const l_ = L + 0.3963377774 * a + 0.2158037573 * b;
  const m_ = L - 0.1055613458 * a - 0.0638541728 * b;
  const s_ = L - 0.0894841775 * a - 1.291485548 * b;
  const l = l_ ** 3, m = m_ ** 3, s = s_ ** 3;
  const lin = [
    +4.0767416621 * l - 3.3077115913 * m + 0.2309699292 * s,
    -1.2684380046 * l + 2.6097574011 * m - 0.3413193965 * s,
    -0.0041960863 * l - 0.7034186147 * m + 1.707614701 * s,
  ];
  return lin.map((x) => {
    const v = x <= 0.0031308 ? 12.92 * x : 1.055 * Math.pow(Math.max(x, 0), 1 / 2.4) - 0.055;
    return Math.round(Math.min(1, Math.max(0, v)) * 255);
  });
}

const W = 794, H = 1123;
const MARGIN = 70; // > 7% of width
const SEED = 20260815;

// palette (OKLCH → sRGB, precomputed once)
const PAPER    = oklch(0.17, 0.022, 268);
const FOGDOT   = oklch(0.38, 0.030, 282);
const UNWALKED = oklch(0.33, 0.028, 275);
const AMBER    = oklch(0.74, 0.135, 74);
const AMBER_HI = oklch(0.86, 0.110, 84);
const EMBER    = oklch(0.58, 0.115, 55);
const FRONTIER = oklch(0.78, 0.125, 199);
const DEST     = oklch(0.63, 0.100, 74);
const INKSIG   = oklch(0.55, 0.020, 275);

let nodes = [];      // {x, y, depth, parent, children:[], pts (polyline from parent), walked, frontier, superseded}
let root, destPt;

function setup() {
  const c = createCanvas(W, H);
  pixelDensity(2);
  randomSeed(SEED); noiseSeed(SEED);
  noLoop();
}

function inBounds(x, y, pad) {
  return x > MARGIN + pad && x < W - MARGIN - pad && y > MARGIN + pad && y < H - MARGIN - pad;
}

function growTree() {
  destPt = { x: W * 0.5 + random(-30, 30), y: H - MARGIN - 130 };
  root = { x: W * 0.5 + random(-40, 40), y: MARGIN + 95, depth: 0, parent: null, children: [], pts: [], walked: false };
  nodes = [root];
  const queue = [{ node: root, angle: HALF_PI + random(-0.25, 0.25), vigor: 1 }];
  while (queue.length) {
    const { node, angle, vigor } = queue.shift();
    if (node.depth >= 13 || vigor <= 0.10) continue;
    const nk = node.depth === 0 ? 4 : (random() < 0.55 ? 2 : (random() < 0.6 ? 3 : 1));
    for (let k = 0; k < nk; k++) {
      const spread = (k - (nk - 1) / 2) * random(0.55, 1.0);
      let a = angle + spread + random(-0.18, 0.18);
      // pull toward destination, stronger as we descend
      const toDest = atan2(destPt.y - node.y, destPt.x - node.x);
      const pull = 0.16 + 0.035 * node.depth;
      a = a + (((toDest - a + PI * 3) % (PI * 2)) - PI) * pull;
      const segLen = random(58, 96) * (0.75 + vigor * 0.45);
      // walk the segment with noise curvature
      const steps = 9;
      let x = node.x, y = node.y, dir = a;
      const pts = [{ x, y }];
      let dead = false;
      for (let s = 0; s < steps; s++) {
        dir += (noise(x * 0.008, y * 0.008, node.depth * 7.3) - 0.5) * 0.55;
        x += (cos(dir) * segLen) / steps;
        y += (sin(dir) * segLen) / steps;
        if (!inBounds(x, y, 16) || y > H - MARGIN - 60) { dead = true; break; }
        pts.push({ x, y });
      }
      if (pts.length < 4) continue;
      const child = {
        x: pts[pts.length - 1].x, y: pts[pts.length - 1].y,
        depth: node.depth + 1, parent: node, children: [], pts, walked: false,
      };
      node.children.push(child); nodes.push(child);
      if (!dead) queue.push({ node: child, angle: dir, vigor: vigor * random(0.82, 0.97) });
    }
  }
}

function markWalked() {
  // main walked spine: from root, repeatedly take the child that makes most progress toward dest
  let cur = root; cur.walked = true;
  const spine = [root];
  const targetY = root.y + (destPt.y - root.y) * 0.58; // the frontier sits ~58% of the way
  while (cur.children.length && cur.y < targetY) {
    let best = null, bestScore = -1e9;
    for (const ch of cur.children) {
      const score = (ch.y - cur.y) - abs(ch.x - destPt.x) * 0.28;
      if (score > bestScore) { bestScore = score; best = ch; }
    }
    best.walked = true; spine.push(best); cur = best;
  }
  // two superseded excursions: short walked side-paths off the upper spine that dead-end
  let made = 0;
  for (let i = 1; i < spine.length - 1 && made < 2; i++) {
    const off = spine[i].children.filter((c) => !c.walked);
    if (off.length && random() < 0.75) {
      let n = off[Math.floor(random(off.length))];
      let hops = 0;
      while (n && hops < 2) {
        n.walked = true; n.superseded = true;
        n = n.children.length ? n.children[Math.floor(random(n.children.length))] : null;
        hops++;
      }
      made++;
    }
  }
  // frontier: unwalked children of walked nodes near the leading edge
  for (const n of nodes) {
    if (n.walked && !n.superseded) {
      for (const ch of n.children) {
        if (!ch.walked && n.y > targetY - 260) ch.frontier = true;
      }
    }
  }
}

function drawPolyline(pts, col, alpha, weight) {
  stroke(col[0], col[1], col[2], alpha); strokeWeight(weight); noFill();
  beginShape();
  for (const p of pts) curveVertex(p.x, p.y);
  curveVertex(pts[pts.length - 1].x, pts[pts.length - 1].y);
  endShape();
}

function walkedDistanceField() {
  // subsample walked polylines for distance queries
  const samples = [];
  for (const n of nodes) if (n.walked && n.pts.length) {
    for (let i = 0; i < n.pts.length; i += 2) samples.push(n.pts[i]);
  }
  samples.push({ x: root.x, y: root.y });
  return (x, y) => {
    let d = 1e9;
    for (const s of samples) {
      const dx = x - s.x, dy = y - s.y;
      const dd = dx * dx + dy * dy;
      if (dd < d) d = dd;
    }
    return sqrt(d);
  };
}

function draw() {
  background(PAPER[0], PAPER[1], PAPER[2]);
  growTree();
  markWalked();
  const distToWalked = walkedDistanceField();

  // ---- fog grain: dense far from the light, thinning near it
  for (let i = 0; i < 52000; i++) {
    const x = random(MARGIN + 6, W - MARGIN - 6);
    const y = random(MARGIN + 6, H - MARGIN - 6);
    const d = distToWalked(x, y);
    const grain = noise(x * 0.0085, y * 0.0085);
    const wisp = noise(x * 0.0028 + 40, y * 0.0028 + 40); // macro structure
    const clear = constrain(map(d, 44, 290, 0.04, 1), 0.04, 1); // cleared near the light
    const density = clear * (0.25 + grain * 0.5) * (0.35 + wisp * 0.9);
    if (random() < density * 0.52) {
      const a = 6 + grain * 11;
      stroke(FOGDOT[0], FOGDOT[1], FOGDOT[2], a);
      strokeWeight(random() < 0.05 ? 1.5 : 1);
      point(x, y);
    }
  }

  // ---- unwalked branches: faint, fading with distance from the light
  for (const n of nodes) {
    if (n.walked || !n.pts.length) continue;
    const d = distToWalked(n.x, n.y);
    const a = constrain(map(d, 0, 430, 62, 8), 8, 62);
    drawPolyline(n.pts, UNWALKED, a, 1.1);
  }

  // ---- destination: a faint shimmer through the fog
  noStroke();
  for (let r = 46; r > 4; r -= 3) {
    fill(DEST[0], DEST[1], DEST[2], map(r, 46, 4, 2.5, 26));
    circle(destPt.x, destPt.y, r);
  }
  noFill(); stroke(DEST[0], DEST[1], DEST[2], 60); strokeWeight(1);
  circle(destPt.x, destPt.y, 13);

  // ---- walked paths: layered glow
  const walkedSegs = nodes.filter((n) => n.walked && n.pts.length);
  for (const n of walkedSegs) {
    const col = n.superseded ? EMBER : AMBER;
    drawPolyline(n.pts, col, n.superseded ? 14 : 22, 10);
    drawPolyline(n.pts, col, n.superseded ? 30 : 52, 4.2);
    drawPolyline(n.pts, n.superseded ? EMBER : AMBER_HI, n.superseded ? 120 : 205, 1.5);
  }

  // ---- nodes
  for (const n of nodes) {
    if (n.walked) {
      const col = n.superseded ? EMBER : AMBER_HI;
      noStroke();
      fill(col[0], col[1], col[2], 26); circle(n.x, n.y, 17);
      fill(col[0], col[1], col[2], n.superseded ? 165 : 235); circle(n.x, n.y, n.superseded ? 4.5 : 6);
      if (n.superseded && !n.children.some((c) => c.walked)) {
        // a small tick where an abandoned path ends
        stroke(EMBER[0], EMBER[1], EMBER[2], 150); strokeWeight(1.2);
        line(n.x - 3.4, n.y - 3.4, n.x + 3.4, n.y + 3.4);
        line(n.x - 3.4, n.y + 3.4, n.x + 3.4, n.y - 3.4);
      }
    } else if (n.frontier) {
      noFill();
      stroke(FRONTIER[0], FRONTIER[1], FRONTIER[2], 60); strokeWeight(3.4); circle(n.x, n.y, 13.5);
      stroke(FRONTIER[0], FRONTIER[1], FRONTIER[2], 225); strokeWeight(1.3); circle(n.x, n.y, 13.5);
      noStroke(); fill(FRONTIER[0], FRONTIER[1], FRONTIER[2], 90); circle(n.x, n.y, 3.2);
    }
  }

  // ---- origin: where the loose idea arrived
  noStroke();
  fill(AMBER_HI[0], AMBER_HI[1], AMBER_HI[2], 30); circle(root.x, root.y, 26);
  fill(AMBER_HI[0], AMBER_HI[1], AMBER_HI[2], 240); circle(root.x, root.y, 7.5);
  noFill(); stroke(AMBER[0], AMBER[1], AMBER[2], 120); strokeWeight(1); circle(root.x, root.y, 15);

  // ---- signature
  noStroke(); fill(INKSIG[0], INKSIG[1], INKSIG[2], 210);
  textFont("Georgia"); textSize(10.5); textAlign(CENTER, BOTTOM);
  text("wayfinding · 2026-08-15 · claude fable 5", W / 2, H - 26);
}
</script>
</body>
</html>
