<!doctype html>
<!-- A coral forest of small irreversible attachments: diffusion-limited aggregation climbing from a baseline, each stuck particle a locked decision, the frontier tips gilded. -->
<html>
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>frontier</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.11.3/p5.min.js"></script>
<style>
  html, body { margin: 0; height: 100%; background: rgb(24, 24, 30); overflow: hidden; }
  #sheet {
    position: absolute; left: 50%; top: 50%;
    width: 794px; height: 1123px;
    transform-origin: center center;
    box-shadow: 0 22px 70px rgba(0,0,0,0.55);
  }
  #sheet canvas { display: block; }
</style>
</head>
<body>
<div id="sheet"></div>
<script>
// oklch(L 0–1, C, H deg) → [r, g, b] each 0–255, clamped to sRGB gamut
function oklch(L, C, H) {
  const h = (H * Math.PI) / 180;
  const a = C * Math.cos(h), b = C * Math.sin(h);
  const l_ = L + 0.3963377774 * a + 0.2158037573 * b;
  const m_ = L - 0.1055613458 * a - 0.0638541728 * b;
  const s_ = L - 0.0894841775 * a - 1.291485548 * b;
  const l = l_ ** 3, m = m_ ** 3, s = s_ ** 3;
  const lin = [
    +4.0767416621 * l - 3.3077115913 * m + 0.2309699292 * s,
    -1.2684380046 * l + 2.6097574011 * m - 0.3413193965 * s,
    -0.0041960863 * l - 0.7034186147 * m + 1.707614701 * s,
  ];
  return lin.map((x) => {
    const v = x <= 0.0031308 ? 12.92 * x : 1.055 * Math.pow(Math.max(x, 0), 1 / 2.4) - 0.055;
    return Math.round(Math.min(1, Math.max(0, v)) * 255);
  });
}

// deterministic PRNG
function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6d2b79f5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

const params = new URLSearchParams(location.search);
const SEED = parseInt(params.get("seed") || String(Math.floor(Date.now() / 1000) % 100000), 10);
const FAST = params.has("fast");
const rnd = mulberry32(SEED);
document.title = "frontier — seed " + SEED;

const W = 794, H = 1123, M = 56;          // sheet + 7% margin
const CELL = 2;
const X0 = M, Y0 = M, X1 = W - M, Y1 = H - M;
const GW = Math.floor((X1 - X0) / CELL);  // 341
const GH = Math.floor((Y1 - Y0) / CELL);  // 505

// palette: lightness ramp with a slow hue drift, deep water → gilded air
const STOPS = [
  [0.36, 0.060, 245],
  [0.50, 0.085, 215],
  [0.64, 0.095, 178],
  [0.77, 0.095, 132],
  [0.88, 0.085, 96],
];
const PAPER = oklch(0.165, 0.014, 262);
const PAGE_INK = oklch(0.62, 0.02, 262);
const GOLD = oklch(0.92, 0.10, 92);

const LUT = [];
for (let i = 0; i < 256; i++) {
  const t = (i / 255) * (STOPS.length - 1);
  const k = Math.min(STOPS.length - 2, Math.floor(t));
  const f = t - k;
  const A = STOPS[k], B = STOPS[k + 1];
  LUT.push(oklch(A[0] + (B[0] - A[0]) * f, A[1] + (B[1] - A[1]) * f, A[2] + (B[2] - A[2]) * f));
}
const colorAt = (j) => LUT[Math.max(0, Math.min(255, Math.round((1 - j / (GH - 1)) * 255)))];

// DLA state
const grid = new Int32Array(GW * GH);     // 0 empty, else index+1
const px = [], py = [], parent = [];
const childCount = [];
let frontMin = GH - 1;
let finished = false;

function occupy(i, j, par) {
  const idx = px.length;
  px.push(i); py.push(j); parent.push(par); childCount.push(0);
  grid[j * GW + i] = idx + 1;
  if (par >= 0) childCount[par]++;
  if (j < frontMin) frontMin = j;
  return idx;
}

function sketch(p) {
  p.setup = function () {
    const c = p.createCanvas(W, H);
    c.parent(document.getElementById("sheet"));
    p.pixelDensity(2);
    p.background(...PAPER);

    // seed: the whole baseline
    for (let i = 0; i < GW; i++) occupy(i, GH - 1, -1);

    // baseline hairline
    p.stroke(...colorAt(GH - 1), 150);
    p.strokeWeight(1.4);
    const by = Y0 + (GH - 1) * CELL + CELL / 2;
    p.line(X0, by, X0 + GW * CELL, by);

    fitSheet();
    window.addEventListener("resize", fitSheet);
  };

  function fitSheet() {
    const s = Math.min(window.innerWidth / W, window.innerHeight / H) * 0.94;
    document.getElementById("sheet").style.transform =
      "translate(-50%, -50%) scale(" + s + ")";
  }

  function walkOne() {
    const spawnY = Math.max(0, frontMin - 14);
    const killY = Math.max(0, frontMin - 46);
    let i = Math.floor(rnd() * GW);
    let j = spawnY;
    for (let step = 0; step < 9000; step++) {
      const r = rnd();
      let ni = i, nj = j;
      if (r < 0.245) ni = Math.min(GW - 1, i + 1);
      else if (r < 0.49) ni = Math.max(0, i - 1);
      else if (r < 0.76) nj = j + 1;   // slight downward drift: bushier, fairer frontier
      else nj = j - 1;
      if (nj < killY) return false;            // wandered off — respawn
      if (nj >= GH) nj = GH - 1;
      const cell = grid[nj * GW + ni];
      if (cell !== 0) {                        // bumped the cluster: stick here
        occupy(i, j, cell - 1);
        drawStick(px.length - 1);
        return true;
      }
      i = ni; j = nj;
    }
    return false;
  }

  function drawStick(idx) {
    const i = px[idx], j = py[idx], par = parent[idx];
    const x = X0 + i * CELL + CELL / 2, y = Y0 + j * CELL + CELL / 2;
    const c = colorAt(j);
    p.stroke(c[0], c[1], c[2], 235);
    p.strokeWeight(1.1);
    if (par >= 0) {
      const pxx = X0 + px[par] * CELL + CELL / 2, pyy = Y0 + py[par] * CELL + CELL / 2;
      p.line(pxx, pyy, x, y);
    } else {
      p.point(x, y);
    }
  }

  p.draw = function () {
    if (finished) return;
    const t0 = performance.now();
    let sticks = 0;
    const stopY = Math.floor(GH * 0.12);
    const maxSticks = FAST ? 100000 : 26;
    while (sticks < maxSticks && performance.now() - t0 < 12) {
      if (walkOne()) sticks++;
      if (frontMin <= stopY || px.length >= GW + 30000) break;
    }
    if (frontMin <= stopY || px.length >= GW + 30000) finish();
  };

  function finish() {
    finished = true;
    // gild the frontier: leaf tips in the upper growth band
    const band = frontMin + Math.floor(GH * 0.20);
    p.noStroke();
    for (let k = GW; k < px.length; k++) {   // skip the seed row
      if (childCount[k] === 0 && py[k] <= band) {
        const x = X0 + px[k] * CELL + CELL / 2, y = Y0 + py[k] * CELL + CELL / 2;
        p.fill(GOLD[0], GOLD[1], GOLD[2], 42);
        p.circle(x, y, 5.2);
        p.fill(GOLD[0], GOLD[1], GOLD[2], 230);
        p.circle(x, y, 1.7);
      }
    }
    // signature
    p.noStroke();
    p.fill(PAGE_INK[0], PAGE_INK[1], PAGE_INK[2], 165);
    p.textFont("Georgia, serif");
    p.textSize(11);
    p.textAlign(p.CENTER, p.CENTER);
    p.text("frontier · 2026-08-17 · claude", W / 2, H - M / 2 - 2);
    window.__done = true;
  }
}

new p5(sketch);
</script>
</body>
</html>
