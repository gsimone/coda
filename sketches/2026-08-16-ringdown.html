<!doctype html>
<!-- A lattice of springs released at once — every trail is the path a value takes between release and rest, ringing or gliding by its own tension and friction, and the ink only settles where the motion dies. -->
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>ringdown</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.11.3/p5.min.js"></script>
<style>
  html, body { margin: 0; height: 100%; }
  body {
    display: flex; align-items: center; justify-content: center;
    background: rgb(228, 226, 221);
  }
  canvas {
    box-shadow: 0 8px 40px rgba(40, 38, 34, 0.28);
    max-width: 94vw; max-height: 94vh;
    width: auto !important; height: auto !important;
  }
</style>
</head>
<body>
<script>
// oklch(L 0–1, C, H deg) → [r, g, b] each 0–255, clamped to sRGB gamut
function oklch(L, C, H) {
  const h = (H * Math.PI) / 180;
  const a = C * Math.cos(h), b = C * Math.sin(h);
  const l_ = L + 0.3963377774 * a + 0.2158037573 * b;
  const m_ = L - 0.1055613458 * a - 0.0638541728 * b;
  const s_ = L - 0.0894841775 * a - 1.291485548 * b;
  const l = l_ ** 3, m = m_ ** 3, s = s_ ** 3;
  const lin = [
    +4.0767416621 * l - 3.3077115913 * m + 0.2309699292 * s,
    -1.2684380046 * l + 2.6097574011 * m - 0.3413193965 * s,
    -0.0041960863 * l - 0.7034186147 * m + 1.707614701 * s,
  ];
  return lin.map((x) => {
    const v = x <= 0.0031308 ? 12.92 * x : 1.055 * Math.pow(Math.max(x, 0), 1 / 2.4) - 0.055;
    return Math.round(Math.min(1, Math.max(0, v)) * 255);
  });
}

const SEED = 20260816;
function mulberry32(seed) {
  let a = seed >>> 0;
  return () => {
    a = (a + 0x6d2b79f5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
const rand = mulberry32(SEED);
const between = (lo, hi) => lo + rand() * (hi - lo);

const W = 794, H = 1123;
const MARGIN = W * 0.09;

const PAPER = oklch(0.97, 0.012, 85);
// damping ratio → ink hue: hard ringers run hot, overdamped gliders run cold
const HUES = [30, 55, 150, 230, 262];
const inkFor = (zeta) => {
  const t = Math.min(1, Math.max(0, (zeta - 0.05) / 1.05));
  const idx = Math.min(HUES.length - 1, Math.floor(t * HUES.length));
  return oklch(0.52, 0.11, HUES[idx]);
};
const GRAPHITE = oklch(0.55, 0.015, 85);

function setup() {
  const c = createCanvas(W, H);
  pixelDensity(2);
  noLoop();
  background(...PAPER);

  const cols = 9, rows = 13;
  // the lattice sits inside the live area with extra air at the bottom,
  // so the loudest ringers still land before the silent margin
  const innerW = W - 2 * MARGIN, innerH = H - 2 * MARGIN - 78;
  const cellW = innerW / (cols - 1), cellH = innerH / (rows - 1);

  noFill();
  strokeCap(ROUND);

  for (let gy = 0; gy < rows; gy++) {
    for (let gx = 0; gx < cols; gx++) {
      const homeX = MARGIN + gx * cellW;
      const homeY = MARGIN + gy * cellH;

      // friction is a field over the sheet: the top has already settled,
      // the bottom still rings — one ringdown read top to bottom
      const heat = gy / (rows - 1);
      const zeta = Math.max(0.04, 1.15 - heat * 1.05 + between(-0.1, 0.1));

      // anisotropic stiffness makes each trajectory a decaying Lissajous
      const wx = between(5.5, 10.5);
      const wy = wx * between(0.55, 1.7);
      // the margin stays silent: no excursion may leave the live area
      const headroom =
        Math.min(homeX - MARGIN, W - MARGIN - homeX, homeY - MARGIN, H - MARGIN - 34 - homeY) + cellW * 0.35;
      const amp = Math.min(
        between(0.5, 1.0) * Math.min(cellW, cellH) * (1.05 + heat * 0.6),
        Math.max(10, headroom / 1.35),
      );
      const ang = between(0, Math.PI * 2);
      let x = Math.cos(ang) * amp, y = Math.sin(ang) * amp;
      let vx = between(-1, 1) * amp * 2.4, vy = between(-1, 1) * amp * 2.4;

      const superseded = rand() < 0.05;
      const cutoff = superseded ? between(0.12, 0.4) : 1;
      const ink = superseded ? GRAPHITE : inkFor(zeta);

      const dt = 1 / 240, T = 7;
      const steps = Math.floor((T / dt) * cutoff);
      let px = homeX + x, py = homeY + y;
      const speedRef = amp * 5.5;

      for (let i = 0; i < steps; i++) {
        vx += (-(wx * wx) * x - 2 * zeta * wx * vx) * dt;
        vy += (-(wy * wy) * y - 2 * zeta * wy * vy) * dt;
        x += vx * dt;
        y += vy * dt;
        const nx = homeX + x, ny = homeY + y;

        // ink accumulates as motion dies: fast segments are ghosts,
        // the settling is what prints
        const speed = Math.hypot(vx, vy);
        const calm = 1 - Math.min(1, speed / speedRef);
        const alpha = superseded ? 13 + calm * 30 : 9 + calm * calm * 92;
        stroke(ink[0], ink[1], ink[2], alpha);
        strokeWeight(0.7 + calm * 1.1);
        line(px, py, nx, ny);
        px = nx; py = ny;

        if (!superseded && speed < amp * 0.012 && Math.hypot(x, y) < 0.35) break;
      }

      if (!superseded) {
        noStroke();
        fill(ink[0], ink[1], ink[2], 235);
        circle(homeX + x, homeY + y, 3.2);
        noFill();
      }
    }
  }

  // signature
  noStroke();
  fill(...oklch(0.55, 0.02, 85));
  textFont('Georgia');
  textSize(10.5);
  textAlign(CENTER, BOTTOM);
  text('ringdown · 2026-08-16 · claude fable 5', W / 2, H - MARGIN * 0.42);
}
</script>
</body>
</html>
