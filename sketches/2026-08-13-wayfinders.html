<!doctype html>
<!-- Four wayfinders sweep disjoint territories of one sheet; every orphan gets a single thread back to its hub. -->
<html>
<head>
<meta charset="utf-8" />
<title>wayfinders</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.11.0/p5.min.js"></script>
<style>
  html, body { margin: 0; height: 100%; }
  body {
    display: flex; align-items: center; justify-content: center;
    background: rgb(228, 226, 221);
  }
  canvas {
    box-shadow: 0 6px 30px rgba(40, 38, 34, 0.28);
    max-width: 94vw; max-height: 94vh;
    width: auto !important; height: auto !important;
    aspect-ratio: 794 / 1123;
  }
</style>
</head>
<body>
<script>
// oklch(L 0–1, C, H deg) → [r, g, b] each 0–255, clamped to sRGB gamut
function oklch(L, C, H) {
  const h = (H * Math.PI) / 180;
  const a = C * Math.cos(h), b = C * Math.sin(h);
  const l_ = L + 0.3963377774 * a + 0.2158037573 * b;
  const m_ = L - 0.1055613458 * a - 0.0638541728 * b;
  const s_ = L - 0.0894841775 * a - 1.291485548 * b;
  const l = l_ ** 3, m = m_ ** 3, s = s_ ** 3;
  const lin = [
    +4.0767416621 * l - 3.3077115913 * m + 0.2309699292 * s,
    -1.2684380046 * l + 2.6097574011 * m - 0.3413193965 * s,
    -0.0041960863 * l - 0.7034186147 * m + 1.707614701 * s,
  ];
  return lin.map((x) => {
    const v = x <= 0.0031308 ? 12.92 * x : 1.055 * Math.pow(Math.max(x, 0), 1 / 2.4) - 0.055;
    return Math.round(Math.min(1, Math.max(0, v)) * 255);
  });
}

const W = 794, H = 1123;
const MARGIN = 64;                    // > 7% of width, silence all around
const GAP = 30;                       // width of the white channel between territories
const SEED = new URLSearchParams(location.search).get("seed") ?? String(Math.floor(Math.random() * 1e9));

// palette — constant-L cool arc, four sibling wayfinders + warm ink on warm paper
const PAPER = oklch(0.972, 0.010, 85);
const INK   = oklch(0.38, 0.02, 85);
const HUES  = [205, 253, 301, 349];   // 144° arc
const TERRA = HUES.map(h => oklch(0.60, 0.115, h));
const TERRA_DEEP = HUES.map(h => oklch(0.45, 0.115, h));

let centers = [];

function setup() {
  const c = createCanvas(W, H);
  pixelDensity(2);
  randomSeed(hashSeed(SEED));
  noiseSeed(hashSeed(SEED + "n"));
  noLoop();
}

function hashSeed(s) {
  let h = 2166136261;
  for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); }
  return (h >>> 0) % 1e9;
}

// four hubs, one per quadrant-ish region, jittered
function placeCenters() {
  const cx = [0.32, 0.68], cy = [0.28, 0.60];
  const spots = [
    [cx[0], cy[0]], [cx[1], cy[0] + 0.06],
    [cx[0] + 0.04, cy[1] + 0.10], [cx[1] - 0.02, cy[1] + 0.20],
  ];
  centers = spots.map(([x, y]) => ({
    x: (x + random(-0.05, 0.05)) * W,
    y: (y + random(-0.04, 0.04)) * H,
  }));
}

function nearestTwo(x, y) {
  let i1 = -1, d1 = Infinity, d2 = Infinity;
  for (let i = 0; i < centers.length; i++) {
    const d = dist(x, y, centers[i].x, centers[i].y);
    if (d < d1) { d2 = d1; d1 = d; i1 = i; }
    else if (d < d2) { d2 = d; }
  }
  return { t: i1, d1, d2 };
}

const inSheet = (x, y) => x > MARGIN && x < W - MARGIN && y > MARGIN && y < H - MARGIN * 1.25;
// a point belongs to a territory's interior when it's clear of the boundary channel
function interior(x, y) {
  const n = nearestTwo(x, y);
  return (n.d2 - n.d1 > GAP) ? n.t : -1;
}

// each wayfinder reads the same field with its own grain
function fieldAngle(x, y, t) {
  const s = 0.0042;
  const base = noise(x * s, y * s, t * 13.7) * TWO_PI * 2;
  return base + t * HALF_PI * 0.5;
}

function draw() {
  background(...PAPER);
  placeCenters();

  // ---- trails: sweep each territory ----
  for (let t = 0; t < centers.length; t++) {
    const N = 1050;
    for (let i = 0; i < N; i++) {
      // rejection-sample a start inside this territory
      let sx, sy, tries = 0;
      do {
        sx = random(MARGIN, W - MARGIN);
        sy = random(MARGIN, H - MARGIN * 1.25);
        tries++;
      } while ((interior(sx, sy) !== t || !inSheet(sx, sy)) && tries < 60);
      if (tries >= 60) continue;

      const deep = random() < 0.07;
      const col = deep ? TERRA_DEEP[t] : TERRA[t];
      stroke(...col, deep ? 46 : 26);
      strokeWeight(deep ? 1.1 : 0.75);
      noFill();

      let x = sx, y = sy;
      beginShape();
      for (let k = 0; k < 70; k++) {
        vertex(x, y);
        const a = fieldAngle(x, y, t);
        x += Math.cos(a) * 1.7;
        y += Math.sin(a) * 1.7;
        if (!inSheet(x, y) || interior(x, y) !== t) break; // stop at the channel
      }
      endShape();
    }
  }

  // ---- hubs ----
  for (let t = 0; t < centers.length; t++) {
    const { x, y } = centers[t];
    noFill();
    stroke(...INK, 220); strokeWeight(1.3);
    circle(x, y, 13);
    stroke(...TERRA_DEEP[t], 200); strokeWeight(1.1);
    circle(x, y, 22);
    noStroke(); fill(...INK, 235);
    circle(x, y, 3.4);
  }

  // ---- orphans in the channels, each given one thread back ----
  const orphans = [];
  let guard = 0;
  while (orphans.length < 7 && guard++ < 4000) {
    const x = random(MARGIN + 20, W - MARGIN - 20);
    const y = random(MARGIN + 20, H - MARGIN * 1.25 - 20);
    const n = nearestTwo(x, y);
    const inChannel = n.d2 - n.d1 < GAP * 0.75 && n.d1 > 70;
    const clear = orphans.every(o => dist(x, y, o.x, o.y) > 95);
    if (inChannel && clear) orphans.push({ x, y, t: n.t });
  }
  for (const o of orphans) {
    const hub = centers[o.t];
    // one thin curved thread back to its hub
    const mx = (o.x + hub.x) / 2 + random(-26, 26);
    const my = (o.y + hub.y) / 2 + random(-26, 26);
    noFill();
    stroke(...INK, 95); strokeWeight(0.7);
    drawingContext.setLineDash([1, 3.5]);
    beginShape();
    for (let k = 0; k <= 40; k++) {
      const u = k / 40;
      const x = (1 - u) * (1 - u) * o.x + 2 * (1 - u) * u * mx + u * u * hub.x;
      const y = (1 - u) * (1 - u) * o.y + 2 * (1 - u) * u * my + u * u * hub.y;
      vertex(x, y);
    }
    endShape();
    drawingContext.setLineDash([]);
    // the orphan itself: a small open ring, paper-backed so it reads on any ground
    noStroke(); fill(...PAPER);
    circle(o.x, o.y, 11);
    noFill(); stroke(...INK, 210); strokeWeight(1.2);
    circle(o.x, o.y, 7);
  }

  // ---- signature ----
  noStroke(); fill(...INK, 170);
  textFont("Georgia"); textSize(10.5); textAlign(CENTER, BASELINE);
  text("wayfinders · 2026-08-13 · claude", W / 2, H - 34);
}
</script>
</body>
</html>
